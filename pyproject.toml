[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-claims-intelligence"
version = "0.1.0"
description = "Public-data claims analytics and dataset-label risk triage portfolio project"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.1.3",
  "scikit-learn==1.6.1",
  "duckdb==1.2.2",
  "matplotlib==3.10.1",
  "seaborn==0.13.2",
  "streamlit==1.43.2",
  "joblib==1.4.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

